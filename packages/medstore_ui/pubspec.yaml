name: medstore_ui
description: "MedStore design system: tokens, Cupertino theme, components, ar/fr strings"
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # The icon family (lucide.dev): one consistent 2px stroke. Read through AppIcons.
  lucide_icons_flutter: 3.1.14+2
  medstore_core:
    path: ../medstore_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  assets:
    - assets/brand/
  # Bundled, so the app looks the same offline and on every platform. Both are SIL OFL 1.1
  # (assets/fonts/OFL.txt). Inter draws Latin text; IBM Plex Sans Arabic draws Arabic (AppTypography).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
